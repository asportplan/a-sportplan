version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: precisetrain
      POSTGRES_PASSWORD: precisetrain
      POSTGRES_DB: precisetrain_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U precisetrain']
      interval: 5s
      timeout: 5s
      retries: 5

  9router:
    image: decolua/9router:latest
    container_name: precisetrain-9router
    ports:
      - '20128:20128'
    environment:
      - DATA_DIR=/app/data
    volumes:
      - 9router_data:/app/data
    restart: unless-stopped

volumes:
  postgres_data:
  9router_data:

